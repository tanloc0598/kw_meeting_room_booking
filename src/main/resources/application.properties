spring.application.name=meeting-room-booking
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.ttl=PT1H
app.booking.min-duration=${BOOKING_MIN_DURATION:PT5M}
app.booking.duration-step=${BOOKING_DURATION_STEP:PT5M}
app.booking.zone=${BOOKING_ZONE:Asia/Ho_Chi_Minh}
app.booking.max-advance=${BOOKING_MAX_ADVANCE:P90D}
spring.docker.compose.start.arguments=postgres
